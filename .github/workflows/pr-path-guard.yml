name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            internal/translator/**
      - name: Verify restricted paths match the approved upstream release
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          # v7.3.8: allow pristine upstream updates, never fork-specific translator edits.
          upstream_commit=c93978c4ea2e908255a2a06c37599fda3651554a
          git fetch --no-tags https://github.com/router-for-me/CLIProxyAPI.git "$upstream_commit"
          git merge-base --is-ancestor "$upstream_commit" HEAD
          git diff --exit-code "$upstream_commit" HEAD -- internal/translator/
